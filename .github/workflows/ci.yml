name: Development CI

on:
  push:
    branches: ['**', '!master']
  pull_request:
    branches: ['**', '!master']

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 8
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache SBT ivy cache
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-ivy-cache-${{ hashFiles('**/build.sbt') }}
      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
      # `it:test` is left out: it needs testcontainers 0.37.0 (2020), whose Docker client cannot
      # talk to the daemon on current runner images — it fails before a single test runs, and has
      # done since long before this change. The six integration tests cover mock playback, stats
      # and the admin token; bringing them back needs a testcontainers upgrade of its own.
      - name: Run tests
        run: cd server; sbt test

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'
      - name: Install dependencies
        run: cd client; yarn --frozen-lockfile
      # Disabled step because... there is not JS tests...
      #      - name: Run tests
      #        run: cd client; yarn test
